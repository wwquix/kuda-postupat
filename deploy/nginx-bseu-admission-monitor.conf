# Rendered by install-server.sh. This is a dedicated server block and does not replace other hosts.
limit_req_zone $binary_remote_addr zone=bseu_refresh:10m rate=2r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    access_log /var/log/nginx/bseu-admission-monitor.access.log;
    error_log /var/log/nginx/bseu-admission-monitor.error.log;

    location = __BASE_PATH__api/refresh {
        limit_req zone=bseu_refresh burst=2 nodelay;
        rewrite ^__BASE_PATH_REGEX__api/refresh$ /api/refresh break;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }

    location ^~ __BASE_PATH__api/ {
        rewrite ^__BASE_PATH_REGEX__api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ^~ __BASE_PATH__ {
        rewrite ^__BASE_PATH_REGEX__(.*)$ /$1 break;
        root /opt/bseu-admission-monitor/frontend/dist;
        try_files $uri $uri/ __BASE_PATH__index.html;
    }

    location / { return 404; }
}
